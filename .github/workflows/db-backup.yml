# Daily logical backup of hosted Supabase Postgres → AWS S3.
#
# Target database is whatever SUPABASE_DB_URL / SUPABASE_PROJECT_REF point at
# (configure those for your production project in GitHub Actions settings).
#
# Required GitHub configuration (Settings → Secrets and variables → Actions):
#
#   Secrets:
#     SUPABASE_DB_URL     Session-mode Postgres URI (port 5432). Prefer the
#                         IPv4-friendly Session pooler string from Supabase
#                         Dashboard → Connect / Project Settings → Database.
#                         Do NOT use the transaction pooler (port 6543).
#                         Replace [YOUR-PASSWORD]; percent-encode special
#                         chars in the password (@ → %40, # → %23, etc.).
#                         No surrounding quotes.
#     AWS_ROLE_TO_ASSUME  IAM role ARN for GitHub OIDC (preferred). Example:
#                         arn:aws:iam::123456789012:role/github-db-backup
#     # Fallback if OIDC is not set up yet (OIDC is preferred):
#     # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
#
#   Variables:
#     SUPABASE_PROJECT_REF  Supabase project ref (Settings → General).
#                           The dump URL must contain this ref so a wrong
#                           project's URI cannot be used by mistake.
#     AWS_REGION            e.g. us-east-1
#     BACKUP_S3_BUCKET      Destination bucket name (no s3:// prefix)
#
# AWS (outside this repo): create the bucket; attach a role trust policy for
# GitHub OIDC (token.actions.githubusercontent.com) limited to this repo +
# this workflow; grant s3:PutObject (and ideally s3:AbortMultipartUpload) on
# arn:aws:s3:::BUCKET/database-backups/*. Enable bucket default
# encryption and block public access. Prefer a lifecycle rule to expire old
# prefixes.
#
# Restore (throwaway / staging only — never restore over prod blindly):
#   1. aws s3 cp s3://$BACKUP_S3_BUCKET/database-backups/YYYY-MM-DD/backup.tar.gz .
#   2. tar -xzf backup.tar.gz
#   3. psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 -f roles.sql -f schema.sql -f data.sql
#   Never commit dump files; never upload dumps as GitHub Actions artifacts
#   (they contain PII / medical notes). See docs/operations-runbook.md.

name: Database backup

on:
  schedule:
    # Once per day (02:15 UTC).
    - cron: "15 2 * * *"
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump and upload to S3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # required for AWS OIDC
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          # If OIDC is unavailable, replace this step with access keys:
          #   aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          #   aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          #   aws-region: ${{ env.AWS_REGION }}
          # and drop permissions.id-token / role-to-assume. OIDC is preferred.

      - name: Dump database
        env:
          # Bound only for this step; never echo or log this value.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set (session-mode Postgres URI for the target project)"
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::SUPABASE_PROJECT_REF variable is not set (Supabase project ref for the target database)"
            exit 1
          fi
          if [ -z "${BACKUP_S3_BUCKET:-}" ]; then
            echo "::error::BACKUP_S3_BUCKET variable is not set"
            exit 1
          fi
          if [ -z "${AWS_REGION:-}" ]; then
            echo "::error::AWS_REGION variable is not set"
            exit 1
          fi

          # Normalize common paste mistakes (quotes / surrounding whitespace).
          # Never echo the URL — it contains the DB password.
          SUPABASE_DB_URL="$(printf '%s' "$SUPABASE_DB_URL" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"

          case "$SUPABASE_DB_URL" in
            postgres://*|postgresql://*)
              ;;
            *)
              echo "::error::SUPABASE_DB_URL must start with postgresql:// or postgres:// (got a non-URI value)."
              exit 1
              ;;
          esac

          case "$SUPABASE_DB_URL" in
            *'[YOUR-PASSWORD]'*|*YOUR-PASSWORD*|*'[PASSWORD]'*)
              echo "::error::SUPABASE_DB_URL still contains a password placeholder. Replace it with the real DB password (URL-encoded if it has special characters)."
              exit 1
              ;;
          esac

          # Reject transaction-pooler URLs (port 6543) — dumps need session/direct.
          case "$SUPABASE_DB_URL" in
            *:6543/*|*:6543)
              echo "::error::SUPABASE_DB_URL looks like the transaction pooler (port 6543). Use session mode on port 5432."
              exit 1
              ;;
          esac

          # Fail closed if the URL does not match the configured project ref.
          case "$SUPABASE_DB_URL" in
            *"${SUPABASE_PROJECT_REF}"*)
              ;;
            *)
              echo "::error::SUPABASE_DB_URL does not contain SUPABASE_PROJECT_REF. Update the secret so it matches the configured project."
              exit 1
              ;;
          esac

          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT
          cd "$WORKDIR"

          dump_or_explain() {
            if ! supabase db dump "$@"; then
              echo "::error::supabase db dump failed to use SUPABASE_DB_URL. Usual cause: DB password special characters (@ # : / ? % space) are not percent-encoded in the URI. Encode them (e.g. @ → %40, # → %23) or reset the DB password to alphanumeric, then update the secret."
              exit 1
            fi
          }

          echo "Dumping roles…"
          dump_or_explain --db-url "$SUPABASE_DB_URL" --role-only -f roles.sql

          echo "Dumping schema…"
          dump_or_explain --db-url "$SUPABASE_DB_URL" -f schema.sql

          echo "Dumping data…"
          dump_or_explain --db-url "$SUPABASE_DB_URL" --data-only --use-copy -f data.sql

          for f in roles.sql schema.sql data.sql; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing or empty"
              exit 1
            fi
            # Size only — never print dump contents.
            echo "$f size_bytes=$(wc -c < "$f" | tr -d ' ')"
          done

          DATE="$(date -u +%Y-%m-%d)"
          tar -czf backup.tar.gz roles.sql schema.sql data.sql
          echo "archive size_bytes=$(wc -c < backup.tar.gz | tr -d ' ')"

          DEST="s3://${BACKUP_S3_BUCKET}/database-backups/${DATE}/backup.tar.gz"
          echo "Uploading archive to dated S3 prefix…"
          aws s3 cp backup.tar.gz "$DEST"
          echo "Upload complete."
